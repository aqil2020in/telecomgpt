services:
  - type: web
    name: telecomgpt-api
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: PYTHONPATH
        value: "."
      - key: TNIC_DATASETS_DIR
        value: "../datasets"
      - key: TNIC_ENABLE_CHROMA
        value: "0"
      # Lean demo: BM25 RAG, no heavy vector ingest on boot
      - key: TELECOMGPT_AUTO_REINDEX
        value: "0"
      - key: TELECOMGPT_LOW_MEMORY
        value: "1"
      - key: TELECOMGPT_VECTOR
        value: "0"
      - key: TELECOMGPT_MAX_PARALLEL_AGENTS
        value: "4"
      - key: TELECOMGPT_LLM_PLAN
        value: "0"
      - key: ORT_LOG_SEVERITY_LEVEL
        value: "3"
      - key: TELECOMGPT_LIVE_FETCH
        value: "0"
      - key: TELECOMGPT_WEB_SEARCH
        value: "0"
      - key: TELECOMGPT_ENGINE
        value: "langgraph"
      - key: TELECOMGPT_FAST_ASK
        value: "1"
      - key: TELECOMGPT_LLM
        value: "openai"
      - key: LLM_TIMEOUT_FAST_SEC
        value: "30"
      - key: TELECOMGPT_ASYNC_ASK
        value: "1"
