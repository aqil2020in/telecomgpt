services:
  - type: web
    name: telecomgpt-api
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python scripts/ingest_rag.py
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      # 2GB Render — full orchestrator + vector RAG + live fetch
      - key: TELECOMGPT_AUTO_REINDEX
        value: "1"
      - key: TELECOMGPT_LOW_MEMORY
        value: "0"
      - key: TELECOMGPT_VECTOR
        value: "1"
      - key: TELECOMGPT_MAX_PARALLEL_AGENTS
        value: "8"
      - key: TELECOMGPT_LLM_PLAN
        value: "1"
      - key: ORT_LOG_SEVERITY_LEVEL
        value: "3"
      - key: TELECOMGPT_LIVE_FETCH
        value: "1"
      - key: TELECOMGPT_WEB_SEARCH
        value: "1"
      - key: TELECOMGPT_ENGINE
        value: "hybrid"
      - key: TELECOMGPT_FAST_ASK
        value: "1"
      - key: TELECOMGPT_LLM
        value: "openai"
      - key: LLM_TIMEOUT_FAST_SEC
        value: "30"
      - key: TELECOMGPT_ASYNC_ASK
        value: "1"
